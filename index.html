<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Samuca Games — Corre São Paulo</title><style>*{box-sizing:border-box}body{margin:0;background:#182442;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(100vw,960px)}canvas{width:100%;aspect-ratio:16/9;display:block;touch-action:none;image-rendering:pixelated;border:3px solid #fff5;border-radius:12px}p{text-align:center;margin:10px}</style><main><canvas id="game" width="960" height="540"></canvas><p>Toque rápido / Espaço: pular · Segure / ↓: rasteira · Toque para recomeçar</p></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;let t=0,score=0,coins=0,speed=5,objects=[],state='ready',last=0,spawn=0,pressed=0,down=false;const floor=435,player={x:220,y:floor,vy:0,slide:false};function reset(){t=0;score=0;coins=0;speed=5;objects=[];spawn=40;player.y=floor;player.vy=0;state='play'}function jump(){if(state!=='play'){reset();return}if(player.y>=floor-1){player.vy=-16;player.slide=false}}function inputDown(){if(state!=='play'){reset();return}pressed=performance.now();down=true}function inputUp(){if(!down)return;down=false;let duration=performance.now()-pressed;if(duration<220)jump();player.slide=false}c.addEventListener('pointerdown',e=>{e.preventDefault();inputDown()});window.addEventListener('pointerup',inputUp);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='ArrowDown'){down=true;pressed=0}});window.addEventListener('keyup',e=>{if(e.code==='ArrowDown')down=false});function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}function text(s,x,y,size=25,color='white'){g.fillStyle=color;g.font='bold '+size+'px monospace';g.fillText(s,x,y)}function boy(x,y,slide){g.save();g.translate(x,y);if(slide){g.translate(0,52);g.rotate(-.85)}const step=Math.sin(t*.55)*12;rect(18,0,43,38,'#201719');rect(13,8,53,36,'#201719');rect(20,15,38,35,'#bd7950');rect(25,27,6,6,'#17191d');rect(46,27,6,6,'#17191d');rect(30,40,18,4,'#fff');rect(21,50,39,42,'#1456cc');rect(16,53,8,31,'#1456cc');rect(60,53,8,31,'#1456cc');rect(24,90,15,slide?9:25+step*.3,'#123f9d');rect(45,90,15,slide?9:25-step*.3,'#123f9d');rect(19,slide?100:110+step*.3,23,9,'#fff');rect(43,slide?100:110-step*.3,23,9,'#fff');g.restore()}function draw(){let sky=g.createLinearGradient(0,0,0,floor);sky.addColorStop(0,'#65c7ff');sky.addColorStop(1,'#e8f6ff');g.fillStyle=sky;g.fillRect(0,0,960,540);rect(65,62,88,22,'#fff9');rect(105,44,110,27,'#fff9');let shift=t*speed*.18;for(let i=-1;i<14;i++){let x=i*95-(shift%95),h=95+(i*71%135);rect(x,floor-50-h,78,h+50,i%2?'#8198b5':'#9cb0c7');for(let yy=floor-h;yy<floor-65;yy+=21)for(let xx=x+10;xx<x+68;xx+=19)rect(xx,yy,9,12,'#dcecf4')}let shift2=t*speed*.5;for(let i=-1;i<9;i++){let x=i*155-(shift2%155);rect(x,350,110,85,i%2?'#e7a46f':'#e6c5a0');rect(x+12,366,29,30,'#384b73');rect(x+53,366,29,30,'#384b73');rect(x+10,413,90,8,'#a64d5c')}rect(0,floor,960,105,'#485267');rect(0,floor,960,12,'#78899c');for(let i=-1;i<12;i++)rect(i*110-(t*speed%110),490,60,7,'#ffdf75');for(const o of objects){if(o.type==='coin'){g.fillStyle='#ffcc32';g.beginPath();g.arc(o.x,o.y,14,0,Math.PI*2);g.fill();g.strokeStyle='#fff2a2';g.lineWidth=4;g.stroke();text('$',o.x-8,o.y+8,23,'#b77915')}else if(o.type==='high'){rect(o.x,355,60,18,'#f7a32e');rect(o.x+8,373,9,30,'#fff');rect(o.x+44,373,9,30,'#fff');rect(o.x,355,60,7,'#fff')}else{rect(o.x,floor-40,45,40,'#f2763d');rect(o.x+8,floor-29,29,7,'#fff');rect(o.x+14,floor-48,17,9,'#f2763d')}}let slide=down&&player.y>=floor-1;player.slide=slide;boy(player.x,player.y-120,slide);text('PONTOS '+Math.floor(score),22,39,25,'#203d68');text('MOEDAS '+coins,22,72,22,'#203d68');if(state!=='play'){rect(175,160,610,170,'#15213cdd');text(state==='ready'?'SAMUCA GAMES!':'FIM DE JOGO',280,223,36);text(state==='ready'?'TOQUE PARA COMEÇAR':'TOQUE PARA REINICIAR',280,275,24)}}function update(){if(state!=='play')return;t++;speed=Math.min(12,5+t/700);score+=.13;player.vy+=.8;player.y=Math.min(floor,player.y+player.vy);if(player.y===floor)player.vy=0;spawn--;if(spawn<=0){let type=Math.random()<.38?'high':'low';objects.push({x:990,type});if(Math.random()<.8)objects.push({x:1050+Math.random()*70,y:type==='high'?320:350,type:'coin'});spawn=Math.max(48,105-speed*3)+Math.random()*45}for(const o of objects){o.x-=speed;if(o.type==='coin'){if(o.x>player.x-10&&o.x<player.x+70&&Math.abs(o.y-(player.y-(player.slide?35:65)))<55){coins++;score+=10;o.x=-100}}else{let px=player.x+13,pw=player.slide?65:48,ph=player.slide?47:92,py=player.y-ph;if(px<o.x+(o.type==='high'?60:45)-8&&px+pw>o.x+8){if(o.type==='low'&&py+ph>floor-39||o.type==='high'&&py<403&&py+ph>355)state='over'}}}objects=objects.filter(o=>o.x>-100)}function loop(now){let delta=Math.min(3,(now-last)/16.67||1);last=now;for(let i=0;i<Math.round(delta);i++)update();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
