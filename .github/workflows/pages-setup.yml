name: Pages setup probe
on:
  push:
    branches: [pages-setup]
permissions:
  pages: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(gh api repos/${{ github.repository }}/pages --jq '.build_type' 2>&1 || true)
          echo "::notice::before=$before"
          out=$(gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow 2>&1) && echo "::notice::SWITCH_OK" || echo "::notice::SWITCH_FAILED $out"
          after=$(gh api repos/${{ github.repository }}/pages --jq '.build_type' 2>&1 || true)
          echo "::notice::after=$after"
